<!DOCTYPE html>
<html lang="pt-MZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Kicks | Loja Premium de Futebol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: {
                            deep: "#BD8A57",
                            mid: "#CEA26B",
                            light: "#DDB77C"
                        },
                        lux: {
                            ink: "#111111",
                            line: "#EAEAEA",
                            surface: "#F3F4F6",
                            bg: "#F8F9FA"
                        }
                    },
                    fontFamily: {
                        sans: ["\"Manrope\"", "ui-sans-serif", "system-ui", "-apple-system", "BlinkMacSystemFont", "\"Segoe UI\"", "sans-serif"],
                        display: ["\"Vonca\"", "\"Cormorant Garamond\"", "Georgia", "serif"]
                    },
                    boxShadow: {
                        product: "0 0.5px 0 rgba(0,0,0,0.05), 0 10px 24px rgba(0,0,0,0.035)",
                        soft: "0 8px 20px rgba(0,0,0,0.035)",
                        panel: "0 14px 34px rgba(0,0,0,0.04)",
                        floating: "0 10px 24px rgba(0,0,0,0.05)"
                    },
                    dropShadow: {
                        shoe: "0 10px 12px rgba(0,0,0,0.08)"
                    }
                }
            }
        };
    </script>
    <style>
        @font-face {
            font-family: 'Vonca';
            src: url('./Vonca/WOFF/Vonca-Regular.woff') format('woff'),
                 url('./Vonca/Vonca-Regular.otf') format('opentype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Vonca';
            src: url('./Vonca/WOFF/Vonca-Medium.woff') format('woff'),
                 url('./Vonca/Vonca-Medium.otf') format('opentype');
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Vonca';
            src: url('./Vonca/WOFF/Vonca-Medium.woff') format('woff'),
                 url('./Vonca/Vonca-Medium.otf') format('opentype');
            font-weight: 600;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Vonca';
            src: url('./Vonca/WOFF/Vonca-Medium.woff') format('woff'),
                 url('./Vonca/Vonca-Medium.otf') format('opentype');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Manrope';
            src: url('./Manrope/Manrope-VariableFont_wght.ttf') format('truetype');
            font-weight: 200 800;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --gold-deep: #BD8A57;
            --gold-mid: #CEA26B;
            --gold-light: #DDB77C;
            --lux-ink: #000000;
            --lux-line: #D8D8D8;
            --lux-surface: #F2F2F2;
            --gold-gradient: linear-gradient(135deg, #BD8A57 0%, #CEA26B 25%, #DDB77C 50%, #CEA26B 75%, #BD8A57 100%);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: "Manrope", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--lux-ink);
            background: #F8F9FA;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }

        @media (min-width: 1024px) {
            body { background: #FFFFFF; }
        }

        .font-display {
            font-family: "Cormorant Garamond", Georgia, serif;
            letter-spacing: -0.025em;
            font-weight: 600;
        }

        @media (max-width: 767px) {
            .mobile-line-clamp-2 {
                display: -webkit-box;
                -webkit-box-orient: vertical;
                -webkit-line-clamp: 2;
                overflow: hidden;
            }
        }

        .lux-ease {
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .lux-ease-slow {
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .glass-top {
            backdrop-filter: blur(18px) saturate(180%);
            -webkit-backdrop-filter: blur(18px) saturate(180%);
        }

        .gold-gradient {
            background-image: var(--gold-gradient);
        }

        .hairline {
            border-color: var(--lux-line);
            border-width: 0.5px;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .surface-grid {
            background-image:
                linear-gradient(rgba(216, 216, 216, 0.34) 0.5px, transparent 0.5px),
                linear-gradient(90deg, rgba(216, 216, 216, 0.34) 0.5px, transparent 0.5px);
            background-size: 24px 24px;
        }

        .shadow-soft {
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.04);
        }

        .page-enter {
            animation: pageFadeUp 0.65s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #size-guide-modal {
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        #size-picker-sheet {
            transition: transform 0.3s ease, opacity 0.3s ease;
            transform: translateY(100%);
            opacity: 0;
        }

        #size-picker-sheet.size-picker-open {
            transform: translateY(0);
            opacity: 1;
        }

        .filter-panel {
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .filter-panel-closed {
            max-height: 0;
        }

        .filter-panel-desktop-open {
            max-height: 300px;
        }

        .filter-panel-mobile-open {
            max-height: 400px;
        }

        .toast-item {
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .toast-enter {
            opacity: 0;
            transform: translateY(12px);
        }

        .toast-ready {
            opacity: 1;
            transform: translateY(0);
        }

        .toast-exit {
            opacity: 0;
            transform: translateY(12px);
        }

        @media (min-width: 1024px) {
            .toast-enter {
                transform: translateY(8px);
            }
        }

        @media (max-width: 1023px) {
            #size-guide-modal {
                transform: translateY(100%);
            }

            #size-guide-modal.size-guide-open {
                transform: translateY(0);
            }
        }

        @media (min-width: 1024px) {
            #size-guide-modal {
                transform: translate(-50%, calc(-50% + 14px)) scale(0.96);
                opacity: 0;
            }

            #size-guide-modal.size-guide-open {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        @keyframes pageFadeUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (hover: hover) {
            .product-card:hover .product-media-primary {
                opacity: 0;
            }

            .product-card:hover .product-media-secondary {
                opacity: 1;
            }

            .product-card:hover .product-copy {
                transform: translateY(-4px);
            }
        }

        #mobile-nav-bar {
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease;
        }

        .desktop-nav-link {
            color: #000000;
        }

        .desktop-nav-link:hover {
            background-image: var(--gold-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .desktop-nav-icon {
            color: #000000;
        }

        .desktop-nav-icon:hover {
            background-image: var(--gold-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .desktop-nav-icon:hover svg * {
            stroke: url(#nav-gold-gradient);
        }

        #site-header {
            transition: background 0.4s ease, box-shadow 0.4s ease, border-color 0.4s ease;
        }

        #mobile-inline-search {
            transition: opacity 0.3s ease, transform 0.3s ease, max-height 0.3s ease, padding 0.3s ease;
            max-height: 96px;
            overflow: hidden;
        }

        @media (min-width: 1024px) {
            #site-header.header-home-top {
                background: transparent;
                border-color: transparent;
                box-shadow: none;
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
            }

            #site-header.header-home-top #desktop-header-row {
                background: transparent;
            }

            #site-header.header-home-top .desktop-nav-link,
            #site-header.header-home-top .desktop-nav-icon {
                color: #FFFFFF;
            }

            #site-header.header-home-top #desktop-header-logo {
                filter: brightness(0) invert(1);
            }

            #site-header.header-home-top #cart-badge-desktop {
                background: #FFFFFF;
                color: #000000;
            }

            #site-header.header-home-scrolled {
                background: rgba(255, 255, 255, 0.96);
                border-color: var(--lux-line);
                box-shadow: 0 10px 24px rgba(0, 0, 0, 0.04);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
            }

            #site-header.header-solid {
                background: #FFFFFF;
                border-color: var(--lux-line);
                box-shadow: none;
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
            }

            #desktop-header-logo {
                transition: filter 0.4s ease;
            }
        }

        @media (max-width: 1023px) {
            #site-header.mobile-search-hidden #mobile-inline-search {
                opacity: 0;
                pointer-events: none;
                max-height: 0;
                padding-top: 0;
                padding-bottom: 0;
                transform: translateY(-8px);
            }
        }

        
    
        #site-header { transition: background 0.35s ease, border-color 0.35s ease; }
        #site-header.header-scrolled {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 0.5px solid var(--lux-line);
        }
    </style>
</head>
<body class="bg-lux-bg text-lux-ink selection:bg-[#CEA26B] selection:text-black overflow-x-hidden w-full">
    <svg aria-hidden="true" width="0" height="0" class="absolute">
        <defs>
            <linearGradient id="nav-gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#BD8A57"></stop>
                <stop offset="25%" stop-color="#CEA26B"></stop>
                <stop offset="50%" stop-color="#DDB77C"></stop>
                <stop offset="75%" stop-color="#CEA26B"></stop>
                <stop offset="100%" stop-color="#BD8A57"></stop>
            </linearGradient>
        </defs>
    </svg>
    <div id="toast-container" class="pointer-events-none fixed bottom-[calc(5.5rem+env(safe-area-inset-bottom))] left-1/2 z-[90] flex w-[calc(100%-2rem)] max-w-md -translate-x-1/2 flex-col gap-3 md:bottom-5"></div>

    <div id="mobile-menu-overlay" class="pointer-events-none fixed inset-0 z-[60] bg-black/35 opacity-0 transition-opacity duration-300"></div>
    <aside id="mobile-menu" class="pointer-events-none fixed inset-y-0 left-0 z-[70] flex w-[88%] max-w-sm -translate-x-full flex-col bg-white transition-transform duration-300 ease-out">
        <div class="flex flex-col h-full w-full">
            <div class="flex items-center justify-between px-5 py-5 border-b border-[color:var(--lux-line)]">
                <img src="./assets/logo.svg" alt="Golden Kicks" class="h-[16px] sm:h-[18px] w-auto object-contain select-none" onerror="this.onerror=null; this.src='./assets/logo.png';">
                <button type="button" onclick="app.toggleMobileMenu(false)" class="flex items-center justify-center text-black hover:opacity-70 lux-ease" aria-label="Fechar">
                    <i data-lucide="x" class="h-5 w-5"></i>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto">
                <div class="px-5 pt-6 pb-4">
                    <button type="button" onclick="app.navigate('plp', { category: 'all' }); app.toggleMobileMenu(false);" class="block w-full text-left py-3 text-[22px] font-semibold tracking-[-0.01em] text-black lux-ease active:text-gold-deep">Ver Tudo</button>
                    <button type="button" onclick="app.navigate('plp', { category: 'campo' }); app.toggleMobileMenu(false);" class="block w-full text-left py-3 text-[22px] font-semibold tracking-[-0.01em] text-black lux-ease active:text-gold-deep">Campo</button>
                    <button type="button" onclick="app.navigate('plp', { category: 'society' }); app.toggleMobileMenu(false);" class="block w-full text-left py-3 text-[22px] font-semibold tracking-[-0.01em] text-black lux-ease active:text-gold-deep">Society</button>
                    <button type="button" onclick="app.navigate('plp', { category: 'futsal' }); app.toggleMobileMenu(false);" class="block w-full text-left py-3 text-[22px] font-semibold tracking-[-0.01em] text-black lux-ease active:text-gold-deep">Futsal</button>
                    <button type="button" onclick="app.navigate('plp', { category: 'new' }); app.toggleMobileMenu(false);" class="block w-full text-left py-3 text-[22px] font-semibold tracking-[-0.01em] text-black lux-ease active:text-gold-deep">Novidades</button>
                </div>
                <div class="border-t border-[color:var(--lux-line)] mx-5"></div>
                <div class="px-5 py-4">
                    <button type="button" onclick="app.toggleMobileMenuBrands()" class="flex w-full items-center justify-between py-2 text-[15px] font-medium text-neutral-600">
                        Marcas
                        <i data-lucide="chevron-down" class="h-4 w-4 transition-transform duration-300 ease-out" id="mobile-menu-brands-chevron"></i>
                    </button>
                    <div id="mobile-menu-brands-list" class="overflow-hidden transition-[max-height] duration-300 ease-out" style="max-height: 0;">
                        <!-- dynamic brands -->
                    </div>
                </div>
                <div class="border-t border-[color:var(--lux-line)] mx-5"></div>
                <div class="px-5 py-4">
                    <button type="button" onclick="app.navigate('about'); app.toggleMobileMenu(false);" class="block w-full text-left py-2.5 text-[15px] font-medium text-neutral-600 lux-ease active:text-black">A Nossa História</button>
                    <button type="button" onclick="app.navigate('size-guide-page'); app.toggleMobileMenu(false);" class="block w-full text-left py-2.5 text-[15px] font-medium text-neutral-600 lux-ease active:text-black">Guia de Tamanhos</button>
                    <button type="button" onclick="app.navigate('surface-guide'); app.toggleMobileMenu(false);" class="block w-full text-left py-2.5 text-[15px] font-medium text-neutral-600 lux-ease active:text-black">Escolher o Piso Certo</button>
                    <button type="button" onclick="app.navigate('boot-care'); app.toggleMobileMenu(false);" class="block w-full text-left py-2.5 text-[15px] font-medium text-neutral-600 lux-ease active:text-black">Cuidar das tuas chuteiras</button>
                    <button type="button" onclick="app.navigate('contact'); app.toggleMobileMenu(false);" class="block w-full text-left py-2.5 text-[15px] font-medium text-neutral-600 lux-ease active:text-black">Contacto</button>
                </div>
            </div>
            <div id="mobile-menu-footer" class="border-t border-[color:var(--lux-line)] px-5 py-5 flex items-center justify-between">
                <!-- dynamic locale render -->
            </div>
        </div>
</aside>

    <div id="search-overlay" class="pointer-events-none fixed inset-0 z-[80] flex flex-col bg-white opacity-0 transition-opacity duration-300">
        <header class="border-b border-[color:var(--lux-line)] px-4 py-4 md:px-10">
            <div class="mx-auto flex max-w-7xl items-center justify-between gap-4">
                <div>
                    <p id="search-overlay-title" class="text-[10px] font-semibold uppercase tracking-[0.24em] text-neutral-500">Pesquisa</p>
                    <h2 id="search-overlay-heading" class="font-display text-3xl leading-[0.92] tracking-[-0.025em] text-black md:text-5xl lg:text-6xl lg:tracking-[-0.03em]">Pesquisa direta no catálogo.</h2>
                </div>
                <button type="button" onclick="app.toggleSearch(false)" class="flex h-11 w-11 items-center justify-center border border-[color:var(--lux-line)] text-black lux-ease hover:border-gold-deep hover:text-gold-deep" aria-label="Fechar pesquisa">
                    <i data-lucide="x" class="h-5 w-5"></i>
                </button>
            </div>
        </header>
        <div class="mx-auto grid w-full max-w-7xl flex-1 gap-8 overflow-y-auto px-4 py-6 md:grid-cols-[minmax(0,1.15fr)_360px] md:px-10 md:py-10">
            <section>
                <label for="search-input" class="sr-only">Pesquisa no catálogo</label>
                <div class="border-b border-black pb-4">
                    <input id="search-input" type="text" oninput="app.handleSearch(this.value)" placeholder="Pesquisa por modelo, piso ou marca" class="w-full bg-transparent text-3xl font-semibold tracking-tight text-black outline-none placeholder:text-neutral-300 md:text-5xl">
                </div>
                <div id="search-results" class="mt-8 grid gap-4"></div>
            </section>
            <aside class="bg-lux-surface px-5 py-6 md:px-6">
                <p id="search-routes-title" class="text-[10px] font-semibold uppercase tracking-[0.24em] text-neutral-500">Atalhos</p>
                <div class="mt-4 grid gap-3">
                    <button type="button" onclick="app.navigate('plp', { category: 'campo' }); app.toggleSearch(false);" class="flex items-center justify-between border border-transparent bg-white px-4 py-4 text-left text-sm font-semibold text-black shadow-soft lux-ease hover:border-gold-deep">
                        <span id="search-route-campo">Rotação elite para campo</span>
                        <i data-lucide="arrow-up-right" class="h-4 w-4 text-gold-deep"></i>
                    </button>
                    <button type="button" onclick="app.navigate('plp', { category: 'society' }); app.toggleSearch(false);" class="flex items-center justify-between border border-transparent bg-white px-4 py-4 text-left text-sm font-semibold text-black shadow-soft lux-ease hover:border-gold-deep">
                        <span id="search-route-society">Seleção rápida para society</span>
                        <i data-lucide="arrow-up-right" class="h-4 w-4 text-gold-deep"></i>
                    </button>
                    <button type="button" onclick="app.scrollHome('section-new-arrivals'); app.toggleSearch(false);" class="flex items-center justify-between border border-transparent bg-white px-4 py-4 text-left text-sm font-semibold text-black shadow-soft lux-ease hover:border-gold-deep">
                        <span id="search-route-new">Novidades</span>
                        <i data-lucide="arrow-up-right" class="h-4 w-4 text-gold-deep"></i>
                    </button>
                </div>
                <div class="mt-8 border-t border-[color:var(--lux-line)] pt-6">
                    <p id="search-logic-title" class="text-[10px] font-semibold uppercase tracking-[0.24em] text-neutral-500">Logica de pesquisa</p>
                    <p id="search-logic-body" class="mt-3 text-sm leading-7 text-neutral-700">Pesquise por marca, piso ou silo. Os resultados priorizam stock disponível.</p>
                </div>
            </aside>
        </div>
    </div>

    <div id="cart-overlay" class="pointer-events-none fixed inset-0 z-[60] bg-black/30 opacity-0 transition-opacity duration-300"></div>
    <aside id="cart-drawer" class="pointer-events-none fixed inset-y-0 right-0 z-[70] flex w-full max-w-[420px] translate-x-full flex-col bg-white transition-transform duration-300 ease-out">
        <header class="flex items-center justify-between border-b border-[color:var(--lux-line)] px-5 py-5">
            <div>
                <p id="cart-title" class="text-[10px] font-semibold uppercase tracking-[0.24em] text-neutral-500">Saco</p>
                <h2 id="cart-heading" class="text-2xl font-semibold text-black">Seleção</h2>
            </div>
            <button type="button" onclick="app.toggleCart(false)" class="flex h-11 w-11 items-center justify-center border border-[color:var(--lux-line)] text-black lux-ease hover:border-gold-deep hover:text-gold-deep" aria-label="Fechar saco">
                <i data-lucide="x" class="h-5 w-5"></i>
            </button>
        </header>
        <div id="cart-items" class="flex-1 overflow-y-auto px-5 py-5"></div>
        <div class="border-t border-[color:var(--lux-line)] px-5 py-5">
            <div class="mb-4 flex items-center justify-between text-[11px] font-semibold uppercase tracking-[0.22em] text-neutral-500">
                <span id="cart-subtotal-label">Subtotal</span>
                <span id="cart-subtotal">0 MT</span>
            </div>
            <div class="grid gap-3">
                <button id="cart-checkout-btn" type="button" onclick="app.startCheckout()" class="gold-gradient flex h-14 items-center justify-center rounded-full text-[11px] font-bold uppercase tracking-[0.26em] text-black shadow-sm lux-ease hover:scale-[1.01]">
                    Finalizar
                </button>
                <button id="cart-continue-btn" type="button" onclick="app.toggleCart(false)" class="flex h-14 items-center justify-center rounded-full border border-[color:var(--lux-line)] text-[11px] font-bold uppercase tracking-[0.26em] text-black lux-ease hover:border-black">
                    Continuar
                </button>
            </div>
        </div>
    </aside>

    <div id="wishlist-overlay" class="pointer-events-none fixed inset-0 z-[60] bg-black/30 opacity-0 transition-opacity duration-300"></div>
    <aside id="wishlist-drawer" class="pointer-events-none fixed inset-y-0 right-0 z-[70] flex w-full max-w-[420px] translate-x-full flex-col bg-white transition-transform duration-300 ease-out">
        <header class="flex items-center justify-between border-b border-[color:var(--lux-line)] px-5 py-5">
            <div>
                <p id="wishlist-label" class="text-[10px] font-semibold uppercase tracking-[0.24em] text-neutral-500">Favoritos</p>
                <h2 id="wishlist-heading" class="text-2xl font-semibold text-black">Seleção guardada</h2>
            </div>
            <button type="button" onclick="app.toggleWishlistDrawer(false)" class="flex h-11 w-11 items-center justify-center border border-[color:var(--lux-line)] text-black lux-ease hover:border-gold-deep hover:text-gold-deep" aria-label="Fechar favoritos">
                <i data-lucide="x" class="h-5 w-5"></i>
            </button>
        </header>
        <div id="wishlist-items" class="flex-1 overflow-y-auto px-5 py-5"></div>
    </aside>

    <div id="size-guide-overlay" class="pointer-events-none fixed inset-0 z-[85] bg-black/45 opacity-0 transition-opacity duration-300"></div>
    <div id="size-guide-modal" class="pointer-events-none fixed inset-x-0 bottom-0 z-[90] max-h-[80vh] overflow-hidden rounded-t-2xl bg-white shadow-panel lg:bottom-auto lg:left-1/2 lg:top-1/2 lg:w-full lg:max-w-lg lg:rounded-none">
        <div id="size-guide-content" class="flex max-h-[80vh] flex-col overflow-hidden"></div>

            handleDropdownEnter(dropdownId) {
                if (this.state.dropdownTimers[dropdownId + "_leave"]) clearTimeout(this.state.dropdownTimers[dropdownId + "_leave"]);

                    Object.keys(this.state.dropdownTimers).forEach(k => clearTimeout(this.state.dropdownTimers[k]));
                    this.state.activeDropdown = dropdownId;
                    this.renderDropdowns();
                }, 100);
            },

            handleDropdownLeave(dropdownId) {
                if (this.state.dropdownTimers[dropdownId + "_enter"]) clearTimeout(this.state.dropdownTimers[dropdownId + "_enter"]);
                this.state.dropdownTimers[dropdownId + "_leave"] = setTimeout(() => {
                    if (this.state.activeDropdown === dropdownId) {
                        this.state.activeDropdown = null;
                        this.renderDropdowns();
                    }
                }, 150);
            },

            renderDropdowns() {
                const dropdowns = ["coleccao", "marcas", "guias"];
                dropdowns.forEach(id => {
                    const el = document.getElementById("dropdown-" + id);
                    const chevron = document.getElementById("chevron-" + id);
                    if (!el) return;
                    if (this.state.activeDropdown === id) {
                        el.classList.remove("pointer-events-none", "opacity-0");
                        el.classList.add("pointer-events-auto", "opacity-100");
                        if (chevron) chevron.style.transform = "rotate(180deg)";
                    } else {
                        el.classList.add("pointer-events-none", "opacity-0");
                        el.classList.remove("pointer-events-auto", "opacity-100");
                        if (chevron) chevron.style.transform = "rotate(0deg)";
                    }
                });

                sizeGuideModal?.addEventListener("touchstart", (event) => this.handleTouchStart(event), { passive: true });

                const sizePickerSheet = document.getElementById("size-picker-sheet");

                const filterDrawer = document.getElementById("filter-drawer");

            formatMoney(value) {
                const amount = value.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
                return settings.currencyPosition === "prefix" ? `${settings.currencySymbol} ${amount}` : `${amount} ${settings.currencySymbol}`;
            },

            getProduct(id) {
                return products.find((product) => product.id === id) || products[0];
            },

            getProductsByCategory(category) {
                return products.filter((product) => {
                    // Legacy single-string router filters (used for header nav)
                    const matchCategory = category === "all" || product.category === category;
                    const matchBrand = this.state.activeBrand === "all" || product.brand === this.state.activeBrand;
                    
                    // Advanced multi-select sidebar filters
                    const { surfaces, silos, brands, levels } = this.state.advancedFilters;
                    
                    const matchSurface = surfaces.length === 0 || surfaces.includes(product.surface);
                    const matchSilo = silos.length === 0 || silos.includes(product.silo);
                    const matchAdvancedBrand = brands.length === 0 || brands.includes(product.brand);
                    const matchLevel = levels.length === 0 || levels.includes(product.level);

                    return matchCategory && matchBrand && matchSurface && matchSilo && matchAdvancedBrand && matchLevel;
                });
            },

            getCartCount() {
                return this.state.cart.reduce((sum, item) => sum + item.quantity, 0);
            },

            getCartSubtotal() {
                return this.state.cart.reduce((sum, item) => {
                    const product = this.getProduct(item.productId);
                    return sum + product.price * item.quantity;
                }, 0);
            },

            getShippingFee() {
                const fees = {
                    pickup: 0,
                    city: 350,
                    province: 1200
                };
                return fees[this.state.checkout.delivery] || 0;
            },

            getPaymentLabel(paymentId) {
                const map = {
                    mpesa: this.t("paymentMpesa"),
                    card: this.t("paymentCard"),
                    cash: this.t("paymentCashPickup")
                };
                return map[paymentId] || paymentId;
            },

            showToast(message) {
                const toast = document.createElement("div");
                toast.className = "toast-item toast-enter pointer-events-auto flex items-center gap-3 border border-black bg-white px-4 py-3 shadow-floating";
                toast.innerHTML = `
                    <span class="gold-gradient flex h-8 w-8 items-center justify-center text-black">
                        <i data-lucide="sparkles" class="h-4 w-4"></i>
                    </span>
                    <p class="text-sm font-semibold text-black">${message}</p>
                `;
                const container = document.getElementById("toast-container");
                container.appendChild(toast);
                lucide.createIcons();
                requestAnimationFrame(() => {
                    toast.classList.remove("toast-enter");
                    toast.classList.add("toast-ready");
                });
                setTimeout(() => {
                    toast.classList.remove("toast-ready");
                    toast.classList.add("toast-exit");
                    setTimeout(() => toast.remove(), 300);
                }, 2600);
            },

            toggleSearch(force) {
                const open = typeof force === "boolean" ? force : !this.state.searchOpen;
                this.state.searchOpen = open;
                const overlay = document.getElementById("search-overlay");
                overlay.classList.toggle("opacity-0", !open);
                overlay.classList.toggle("pointer-events-none", !open);
                if (open) {
                    setTimeout(() => {
                        const input = document.getElementById("search-input");
                        if (input) input.focus();
                    }, 60);
                }
                this.syncBodyLock();
                this.syncNav();
            },

                this.state.menuOpen = open;
                const overlay = document.getElementById("mobile-menu-overlay");
                const panel = document.getElementById("mobile-menu");
                overlay.classList.toggle("opacity-0", !open);
                overlay.classList.toggle("pointer-events-none", !open);
                panel.classList.toggle("-translate-x-full", !open);
                panel.classList.toggle("pointer-events-none", !open);

            },

            closeSizePicker() {

                const overlay = document.getElementById("size-picker-overlay");

            toggleFilterDrawer(force) {
                const open = typeof force === "boolean" ? force : !this.state.filterDrawerOpen;
                this.state.filterDrawerOpen = open;
                const overlay = document.getElementById("filter-drawer-overlay");
                const panel = document.getElementById("filter-drawer");
                if(overlay) {
                    overlay.classList.toggle("opacity-0", !open);
                    overlay.classList.toggle("pointer-events-none", !open);
                }
                if(panel) {
                    panel.classList.toggle("translate-y-full", !open);
                    panel.classList.toggle("pointer-events-none", !open);
                }
                this.syncBodyLock();
                this.syncNav();
            },

            handleTouchStart(event) {
                if (window.innerWidth >= 1024) return;
                this.state.touchStartY = event.changedTouches[0]?.clientY ?? null;
            },

            handleTouchEnd(event, closeCallback) {
                if (window.innerWidth >= 1024) return;
                const startY = this.state.touchStartY;
                if (startY == null) return;
                const endY = event.changedTouches[0]?.clientY ?? startY;
                this.state.touchStartY = null;
                if (endY - startY > 80) closeCallback();
            },

            syncBodyLock() {
                const shouldLock = this.state.searchOpen || this.state.menuOpen || this.state.cartOpen || this.state.wishlistOpen || this.state.sizeGuideOpen || this.state.sizePickerOpen || this.state.filterDrawerOpen;
                document.body.classList.toggle("overflow-hidden", shouldLock);
            },

            syncNav() {
                const routes = ["home", "search", "account", "plp"];
                routes.forEach((route) => {
                    const btn = document.querySelector(`[data-mobile-route="${route}"]`);
                    const lbl = document.getElementById(`mobile-nav-${route}`);
                    if (!btn) return;
                    
                    let active = false;
                    if (route === "home" && this.state.currentView === "home" && !this.state.searchOpen) active = true;
                    if (route === "search" && this.state.searchOpen) active = true;
                    if (route === "plp" && this.state.currentView === "plp" && !this.state.searchOpen && !this.state.filterDrawerOpen) active = true;

                    btn.classList.toggle("text-black", active);
                    btn.classList.toggle("active", active); // For custom pseudo classes
                    btn.classList.toggle("text-neutral-400", !active);
                });
            },

            toggleAdvancedFilter(group, option) {
                const current = this.state.advancedFilters[group];
                if (!Array.isArray(current)) return;
                if (current.includes(option)) {
                    this.state.advancedFilters[group] = current.filter(item => item !== option);
                } else {
                    this.state.advancedFilters[group].push(option);
                }
                if (this.state.currentView === 'plp') {
                    this.renderPLP();
                }
                lucide.createIcons();
            },

            navigate(view, options = {}) {
                if (this.state.filterDrawerOpen) this.toggleFilterDrawer(false);
                if (this.state.sizeGuideOpen) this.toggleSizeGuide(false);
                if (this.state.sizePickerOpen) this.closeSizePicker();
                
                if (options.category) {
                    this.resetAdvancedFilters();
                    this.state.activeCategory = options.category;
                    this.state.activeBrand = "all";
                }
                if (options.brand) {
                    this.resetAdvancedFilters();
                    this.state.activeBrand = options.brand;
                    this.state.activeCategory = "all";
                }
                if (options.surfaces) {
                    this.resetAdvancedFilters();
                    this.state.advancedFilters.surfaces = Array.isArray(options.surfaces) ? options.surfaces : [options.surfaces];
                    this.state.activeCategory = "all";
                    this.state.activeBrand = "all";
                }
                if (options.surface) {
                    this.resetAdvancedFilters();
                    const surfUpper = options.surface.toUpperCase();
                    this.state.advancedFilters.surfaces = [surfUpper];
                    this.state.activeCategory = "all";
                    this.state.activeBrand = "all";
                }
                if (options.badge) {
                    this.resetAdvancedFilters();
                    this.state.selectedBadges = [options.badge];
                    this.state.activeCategory = "all";
                    this.state.activeBrand = "all";
                }
                if (options.silo) {
                    this.resetAdvancedFilters();
                    this.state.advancedFilters.silos = [options.silo];
                    this.state.activeCategory = "all";
                    this.state.activeBrand = "all";
                }
                if (options.level) {
                    this.resetAdvancedFilters();
                    this.state.advancedFilters.levels = [options.level];
                    this.state.activeCategory = "all";
                    this.state.activeBrand = "all";
                }

                if (this.state.currentView === "plp") {
                    this.state.plpScrollY = window.scrollY;
                }

                if (view === "pdp" && options.productId) {
                    const product = this.getProduct(options.productId);
                    this.state.currentProductId = product.id;
                    this.state.selectedSize = product.sizes[0];
                    this.state.activeGalleryImage = product.gallery[0];
                    this.state.pdpQuantity = 1;
                    
                    let rv = this.state.recentlyViewed;
                    if(rv) {
                        rv = rv.filter(pId => pId !== product.id);
                        rv.unshift(product.id);
                        if (rv.length > 6) rv = rv.slice(0, 6);
                        this.state.recentlyViewed = rv;
                    }
                }

                this.state.currentView = view;
                if (view !== 'home' && this.state.trustBarInterval) {
                    clearInterval(this.state.trustBarInterval);
                    this.state.trustBarInterval = null;
                }

                document.getElementById("view-home").classList.add("hidden");
                document.getElementById("view-plp").classList.add("hidden");
                document.getElementById("view-pdp").classList.add("hidden");
                document.getElementById("view-checkout").classList.add("hidden");
                document.getElementById("view-confirmation").classList.add("hidden");
                document.getElementById("view-about").classList.add("hidden");
                document.getElementById("view-size-guide-page").classList.add("hidden");
                document.getElementById("view-surface-guide").classList.add("hidden");
                document.getElementById("view-boot-care").classList.add("hidden");
                document.getElementById("view-contact").classList.add("hidden");

                if (view === "home") {
                    this.renderHome();
                    document.getElementById("view-home").classList.remove("hidden");
                }

                if (view === "plp") {
                    this.renderPLP();
                    document.getElementById("view-plp").classList.remove("hidden");
                }

                if (view === "pdp") {
                    this.renderPDP();
                    document.getElementById("view-pdp").classList.remove("hidden");
                }

                if (view === "checkout") {
                    this.renderCheckout();
                    document.getElementById("view-checkout").classList.remove("hidden");
                    setTimeout(() => this.validateCheckout(), 0);
                }

                if (view === "confirmation") {
                    this.renderOrderConfirmation();
                    document.getElementById("view-confirmation").classList.remove("hidden");
                }

                if (view === "about") {
                    this.renderAbout();
                    document.getElementById("view-about").classList.remove("hidden");
                }

                if (view === "size-guide-page") {
                    this.renderSizeGuidePage();
                    document.getElementById("view-size-guide-page").classList.remove("hidden");
                }

                if (view === "surface-guide") {
                    this.renderSurfaceGuide();
                    document.getElementById("view-surface-guide").classList.remove("hidden");
                }

                if (view === "boot-care") {
                    this.renderBootCare();
                    document.getElementById("view-boot-care").classList.remove("hidden");
                }

                if (view === "contact") {
                    this.renderContact();
                    document.getElementById("view-contact").classList.remove("hidden");
                }

                const mobileNav = document.getElementById("mobile-nav-bar");
                if (mobileNav) {
                    if (view === "pdp" || view === "checkout" || view === "confirmation") {
                        mobileNav.style.transform = "translate(-50%, 120%)";
                        mobileNav.style.opacity = "0";
                        mobileNav.style.pointerEvents = "none";
                    } else {
                        mobileNav.style.transform = "translate(-50%, 0)";
                        mobileNav.style.opacity = "1";
                        mobileNav.style.pointerEvents = "auto";
                    }
                }

                this.toggleSearch(false);
                this.toggleMobileMenu(false);
                this.syncHeaderMode();
                if (view === "plp" && this.state.plpScrollY) {
                    setTimeout(() => window.scrollTo({ top: this.state.plpScrollY, behavior: "instant" }), 0);
                } else {
                    window.scrollTo({ top: 0, behavior: "smooth" });
                }
                this.syncNav();
                lucide.createIcons();
            },

            getRelatedProducts(product) {
                const sameCategory = products.filter((item) => item.category === product.category && item.id !== product.id);
                const fallback = products.filter((item) => item.id !== product.id && item.category !== product.category);
                return [...sameCategory, ...fallback].slice(0, 4);
            },

            },

            buildSidebar(context = "desktop") {
                const scopedProducts = products.filter((product) => {
                    const matchCategory = this.state.activeCategory === "all" || product.category === this.state.activeCategory;
                    const matchBrand = this.state.activeBrand === "all" || product.brand === this.state.activeBrand;
                    return matchCategory && matchBrand;
                });
                const unique = (key) => [...new Set(scopedProducts.map((product) => product[key]).filter(Boolean))];
                
                const uniqueSurfaces = ["FG", "AG", "SG", "IC", "HG", "MG", "TF"];
                const uniqueSurfacesRaw = unique("surface");
                
                const uniqueSilos = unique("silo").filter((value) => !uniqueSurfaces.includes(value) && value !== "IN");
                
                let uniqueLevels = unique("level");
                ["Academy", "Club"].forEach(l => { if (!uniqueLevels.includes(l)) uniqueLevels.push(l); });

                const desiredOrderSidebar = ["Nike", "Adidas", "Puma", "New Balance", "Mizuno", "Joma"];
                const uniqueBrands = desiredOrderSidebar.slice();

                const surfaceLabels = {
                    FG: "Campo (FG)",
                    AG: "Campo Artificial (AG)",
                    SG: "Campo Macio (SG)",
                    IC: "Futsal (IC)",
                    HG: "Piso Duro (HG)",
                    MG: "Piso Polivalente (MG)",
                    TF: "Society (TF)"
                };
                const filterGroups = [
                    {
                        key: "surfaces",
                        title: { pt: "Superfície", en: "Surface" },
                        options: uniqueSurfaces.map((value) => ({ value, label: surfaceLabels[value] || value }))
                    },
                    {
                        key: "silos",
                        title: { pt: "Silo", en: "Silo" },
                        options: uniqueSilos.map((value) => ({ value, label: value }))
                    },
                    {
                        key: "brands",
                        title: { pt: "Marca", en: "Brand" },
                        options: uniqueBrands.map((value) => ({ value, label: value }))
                    },
                    {
                        key: "levels",
                        title: { pt: "Nível", en: "Level" },
                        options: uniqueLevels.map((value) => ({ value, label: value }))
                    }
                ].filter((group) => group.options.length);
                const openClass = context === "mobile" ? "filter-panel-mobile-open" : "filter-panel-desktop-open";
                
                return `<div class="flex flex-col w-full">` + filterGroups.map(group => `
                    <div class="border-b-[0.5px] border-[#D8D8D8] py-5 w-full group">
                        <button type="button" onclick="app.toggleFilterGroup('${group.key}')" aria-expanded="${this.state.filterGroupState[group.key] ? "true" : "false"}" class="flex w-full items-center justify-between text-left focus:outline-none focus:ring-0">
                            <span class="text-[15px] font-bold text-[#000000]">${this.l(group.title)}</span>
                            <i data-lucide="chevron-down" class="h-4 w-4 text-[#000000] transition-transform duration-300 ${this.state.filterGroupState[group.key] ? "" : "rotate-180"}"></i>
                        </button>
                        <div class="filter-panel ${this.state.filterGroupState[group.key] ? openClass : "filter-panel-closed"} mt-4">
                            <div class="flex flex-col gap-3">
                            ${group.options.map(opt => {
                                const isActive = this.state.advancedFilters[group.key].includes(opt.value);
                                return `
                                <label class="flex items-center gap-3 cursor-pointer group/label" onclick="event.preventDefault(); app.toggleAdvancedFilter('${group.key}', '${opt.value}')">
                                    <div class="flex h-5 w-5 items-center justify-center rounded-[4px] border-[1px] ${isActive ? 'border-[#000000] bg-[#000000]' : 'border-[#D8D8D8] bg-[#FFFFFF] group-hover/label:border-[#000000]'} transition-colors">
                                        ${isActive ? '<i data-lucide="check" class="h-3.5 w-3.5 text-white"></i>' : ''}
                                    </div>
                                    <span class="text-[14px] text-[#000000] leading-none select-none ${isActive ? 'font-medium' : ''}">${opt.label}</span>
                                </label>
                                `;
                            }).join("")}
                            </div>
                        </div>
                    </div>
                `).join("") + `</div>`;
            },
    
            buildFilterChips(context) {
                return Object.keys(collectionMeta).map((key) => {
                    const active = this.state.activeCategory === key;
                    return `
                        <button type="button"
                            onclick="${context === "plp" ? `app.navigate('plp', { category: '${key}' })` : `app.setCategory('${key}')`}"
                            class="${active ? "border-black bg-black text-white" : "border-[color:var(--lux-line)] bg-white text-neutral-700 hover:border-black"} inline-flex h-11 items-center justify-center px-4 text-[11px] font-semibold uppercase tracking-[0.24em] lux-ease">
                            ${this.l(collectionMeta[key].label)}
                        </button>

                            <div class="mt-8 flex flex-col gap-4 sm:flex-row sm:justify-center">
                                <button type="button" onclick="app.reopenWhatsApp()" class="flex h-14 items-center justify-center gap-3 rounded-full bg-[#25D366] px-8 text-xs font-bold uppercase tracking-[0.2em] text-white shadow-lg lux-ease hover:bg-[#20ba5a]">
                                    <svg class="h-5 w-5 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-1.14 4.164 4.257-1.116z"/></svg>
                                    Abrir WhatsApp Novamente (+258 87 992 6086)
                                </button>
                                <button type="button" onclick="app.navigate('plp')" class="flex h-14 items-center justify-center border border-black px-8 text-xs font-bold uppercase tracking-[0.2em] text-black lux-ease hover:bg-black hover:text-white">
                                    Voltar à Loja
                                </button>
                            </div>
                        </div>
                    </section>
                `;
            },

            buildWhatsAppMessage(order) {
                const lines = [
                    "🛒 NOVO PEDIDO — GOLDEN KICKS",
                    "",
                    `Pedido: ${order.orderNumber}`,
                    "",
                    "Cliente:",
                    order.name || "Cliente",
                    "",
                    "Produtos:"
                ];

                if (order.items && order.items.length) {
                    order.items.forEach(item => {
                        const product = this.getProduct(item.productId);
                        const formattedPrice = this.formatMoney(product.price * item.quantity);
                        lines.push(`1x ${product.name}`);
                        lines.push(`Tamanho: ${item.size}`);
                        lines.push(`Preço: ${formattedPrice}`);
                        lines.push("");
                    });
                }

                lines.push("Entrega:");
                lines.push(order.city || "Maputo");
                lines.push(order.address || "Sem endereço");
                lines.push("");
                lines.push(`Total: ${this.formatMoney(order.total || 0)}`);
                lines.push("");
                lines.push("Método de pagamento:");
                lines.push(order.payment || "M-Pesa");

                return lines.join("\n");
            },

            sendOrderToWhatsApp(order) {
                const message = this.buildWhatsAppMessage(order);
                const phone = "258879926086";
                const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
                try {
                    const win = window.open(url, "_blank");
                    if (!win || win.closed || typeof win.closed === "undefined") {
                        window.location.href = url;
                    }
                } catch(e) {
                    window.location.href = url;
                }
            },

            reopenWhatsApp() {
                if (this.state.lastOrder) {
                    this.sendOrderToWhatsApp(this.state.lastOrder);
                }
            },

            sendContactFormToWhatsApp(form) {
                const name = form.querySelector('[name="contact-name"]')?.value || '';
                const contact = form.querySelector('[name="contact-info"]')?.value || '';
                const subject = form.querySelector('[name="contact-subject"]')?.value || 'Contacto';
                const message = form.querySelector('[name="contact-message"]')?.value || '';

                if (!name.trim() || !contact.trim() || !message.trim()) {
                    this.showToast("Por favor preencha todos os campos do formulário.");
                    return;
                }

                const fullText = `📩 *NOVA MENSAGEM — GOLDEN KICKS*

*Cliente:* ${name.trim()}
*Contacto:* ${contact.trim()}
*Assunto:* ${subject.trim()}

*Mensagem:*
${message.trim()}`;

                const phone = "258879926086";
                const url = `https://wa.me/${phone}?text=${encodeURIComponent(fullText)}`;
                
                try {
                    const win = window.open(url, "_blank");
                    if (!win || win.closed || typeof win.closed === "undefined") {
                        window.location.href = url;
                    }
                } catch(e) {
                    window.location.href = url;
                }

                this.showToast("Redirecionando para o WhatsApp...");
            },

            renderCart() {
                const container = document.getElementById("cart-items");
                if (!this.state.cart.length) {
                    container.innerHTML = `
                        <div class="flex h-full min-h-[320px] flex-col items-center justify-center text-center">
                            <p class="text-[10px] font-semibold uppercase tracking-[0.24em] text-neutral-500">${this.state.locale === "pt" ? "Saco vazio" : "Cart empty"}</p>
                            <h3 class="mt-4 text-4xl font-semibold leading-none text-black">${this.state.locale === "pt" ? "Seleção vazia." : "Selection not started."}</h3>
                            <p class="mt-4 max-w-xs text-sm leading-7 text-neutral-700">${this.state.locale === "pt" ? "Adicione um artigo a partir do catálogo para abrir o percurso de finalização." : "Add a pair from the catalogue to unlock checkout."}</p>
                        </div>
                    `;
                } else {
                    container.innerHTML = this.state.cart.map((item, index) => {
                        const product = this.getProduct(item.productId);
                        return `
                            <article class="grid grid-cols-[84px_minmax(0,1fr)] gap-4 border-b border-[color:var(--lux-line)] py-4">
                                <img src="${product.image}" alt="${product.name}" class="h-28 w-[84px] object-cover">
                                <div>
                                    <div class="flex items-start justify-between gap-3">
                                        <div>
                                            <p class="text-[10px] font-semibold uppercase tracking-[0.24em] text-neutral-500">${product.brand} / ${product.surface}</p>
                                            <h3 class="mt-2 text-[28px] font-semibold leading-none text-black">${product.name}</h3>
                                        </div>
                                        <button type="button" onclick="app.removeFromCart(${index})" class="text-neutral-400 lux-ease hover:text-black" aria-label="Remover item">
                                            <i data-lucide="trash-2" class="h-4 w-4"></i>
                                        </button>
                                    </div>
                                    <p class="mt-2 text-[11px] font-semibold uppercase tracking-[0.18em] text-neutral-500">Tamanho ${item.size}</p>
                                    <div class="mt-4 flex items-center justify-between gap-3">
                                        <div class="flex items-center border border-[color:var(--lux-line)]">
                                            <button type="button" onclick="app.changeQty(${index}, -1)" class="flex h-11 w-11 items-center justify-center text-black lux-ease hover:bg-lux-surface">-</button>
                                            <span class="flex h-11 min-w-11 items-center justify-center text-sm font-semibold text-black">${item.quantity}</span>
                                            <button type="button" onclick="app.changeQty(${index}, 1)" class="flex h-11 w-11 items-center justify-center text-black lux-ease hover:bg-lux-surface">+</button>
                                        </div>
                                        <p class="text-sm font-semibold text-black">${this.formatMoney(product.price * item.quantity)}</p>
                                    </div>
                                </div>
                            </article>
                        `;
                    }).join("");
                }

                document.getElementById("cart-subtotal").textContent = this.formatMoney(this.getCartSubtotal());
                this.updateBadges();
                lucide.createIcons();
            },

            renderWishlist() {
                const container = document.getElementById("wishlist-items");
                if (!container) return;

                const wishlistProducts = this.state.wishlist
                    .map((productId) => products.find((product) => product.id === productId))
                    .filter(Boolean);

                if (!wishlistProducts.length) {
                    container.innerHTML = `
                        <div class="flex h-full min-h-[24rem] flex-col items-center justify-center text-center">
                            <p class="text-sm font-semibold text-black">${this.t("wishlistEmpty")}</p>
                            <button type="button" onclick="app.toggleWishlistDrawer(false); app.navigate('plp', { category: 'all' })" class="mt-6 flex h-12 items-center justify-center border border-[color:var(--lux-line)] px-6 text-[11px] font-semibold uppercase tracking-[0.24em] text-black lux-ease hover:border-black">
                                ${this.t("wishlistEmptyCTA")}
                            </button>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = wishlistProducts.map((product) => `
                    <article class="border-b border-[color:var(--lux-line)] py-5 last:border-b-0">
                        <div class="grid grid-cols-[92px_minmax(0,1fr)] gap-4">
                            <button type="button" onclick="app.toggleWishlistDrawer(false); app.navigate('pdp', { productId: '${product.id}' })" class="aspect-[4/5] overflow-hidden bg-lux-surface">
                                <img src="${product.image}" alt="${product.name}" class="h-full w-full object-cover">
                            </button>
                            <div class="flex min-w-0 flex-col">
                                <p class="text-[10px] font-semibold uppercase tracking-[0.24em] text-neutral-500">${product.brand} / ${product.surface}</p>
                                <button type="button" onclick="app.toggleWishlistDrawer(false); app.navigate('pdp', { productId: '${product.id}' })" class="mt-2 text-left text-base font-semibold leading-7 text-black lux-ease hover:text-gold-deep">
                                    ${product.name}
                                </button>
                                <p class="mt-2 text-sm font-semibold uppercase tracking-[0.18em] text-black">${this.formatMoney(product.price)}</p>
                                <button type="button" onclick="app.addWishlistToCart('${product.id}')" class="mt-4 flex h-11 items-center justify-center border border-[color:var(--lux-line)] px-4 text-[11px] font-semibold uppercase tracking-[0.22em] text-black lux-ease hover:border-black">
                                    ${this.t("wishlistAddToBag")}
                                </button>
                            </div>
                        </div>
                    </article>
                `).join("");
            },

            renderSizeGuide() {
                const container = document.getElementById("size-guide-content");
                if (!container) return;

                container.innerHTML = `
                    <div class="flex h-full flex-col bg-white">
                        <div class="flex justify-center pt-3 lg:hidden">
                            <span class="h-1 w-10 rounded-full bg-neutral-300"></span>
                        </div>
                        <header class="flex items-start justify-between px-5 pb-4 pt-4 lg:px-8 lg:pb-6 lg:pt-6">
                            <div>
                                <p class="text-[10px] font-semibold uppercase tracking-[0.24em] text-neutral-500">${this.t("sizeLabel")}</p>
                                <h2 class="mt-3 font-display text-3xl leading-[0.92] tracking-[-0.03em] text-black lg:text-5xl">${this.t("sizeGuideTitle")}</h2>
                            </div>
                            <button type="button" onclick="app.toggleSizeGuide(false)" class="hidden h-11 w-11 items-center justify-center border border-[color:var(--lux-line)] text-black lux-ease hover:border-gold-deep hover:text-gold-deep lg:flex" aria-label="${this.t("closeAction")}">
                                <i data-lucide="x" class="h-5 w-5"></i>
                            </button>
                        </header>
                        <div class="flex-1 overflow-y-auto px-5 pb-5 lg:px-8 lg:pb-8">
                            <div class="overflow-x-auto">
                                <table class="min-w-full border-collapse text-[13px] lg:text-sm">
                                    <thead>
                                        <tr class="border-b border-[color:var(--lux-line)] text-left">
                                            <th class="px-3 py-3 text-[10px] font-semibold uppercase tracking-[0.22em] text-neutral-500">EU</th>
                                            <th class="px-3 py-3 text-[10px] font-semibold uppercase tracking-[0.22em] text-neutral-500">UK</th>
                                            <th class="px-3 py-3 text-[10px] font-semibold uppercase tracking-[0.22em] text-neutral-500">US</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${sizeGuideRows.map((row, index) => `
                                            <tr class="border-b border-[color:var(--lux-line)] ${index % 2 === 1 ? "bg-lux-surface" : "bg-white"}">
                                                <td class="px-3 py-3 font-semibold text-black">${row.eu}</td>
                                                <td class="px-3 py-3 text-neutral-700">${row.uk}</td>
                                                <td class="px-3 py-3 text-neutral-700">${row.us}</td>
                                            </tr>
                                        `).join("")}
                                    </tbody>
                                </table>
                            </div>
                            <p class="mt-5 text-[13px] leading-7 text-neutral-700 lg:text-sm">${this.t("sizeGuideNote")}</p>
                        </div>
                        <div class="border-t border-[color:var(--lux-line)] px-5 py-4 lg:hidden">
                            <button type="button" onclick="app.toggleSizeGuide(false)" class="flex h-12 w-full items-center justify-center rounded-full bg-black text-[11px] font-semibold uppercase tracking-[0.24em] text-white lux-ease hover:bg-neutral-800">
                                ${this.t("closeAction")}
                            </button>
                        </div>
                    </div>
                `;
                lucide.createIcons();
            },

            renderSizePicker() {
                const container = document.getElementById("size-picker-content");
                if (!container) return;
                const product = this.state.sizePickerProductId ? this.getProduct(this.state.sizePickerProductId) : null;

                container.innerHTML = product ? `
                    <div class="flex h-full flex-col bg-white">
                        <div class="flex justify-center pt-3">
                            <span class="h-1 w-10 rounded-full bg-neutral-300"></span>
                        </div>
                        <div class="px-5 pb-[max(1.25rem,env(safe-area-inset-bottom))] pt-4">
                            <p class="text-[10px] font-semibold uppercase tracking-[0.24em] text-neutral-500">${this.t("quickAddPrompt")}</p>
                            <p class="mt-3 truncate text-base font-semibold text-black">${product.name}</p>
                            <div class="mt-5 grid grid-cols-5 gap-2">
                                ${product.sizes.map((size) => `
                                    <button type="button" onclick="app.addSizePickerSelection(${size})" class="flex h-12 w-12 items-center justify-center border border-lux-line text-sm font-semibold text-black lux-ease hover:border-black hover:bg-black hover:text-white">
                                        ${size}
                                    </button>
                                `).join("")}
                            </div>
                        </div>
                    </div>
                ` : "";
            },

            renderSearchResults(query) {
                const container = document.getElementById("search-results");
                if (!container) return;
                const normalized = query.trim().toLowerCase();
                const matches = normalized
                    ? products.filter((product) =>
                        [product.name, product.brand, product.surface, product.category, product.badge].join(" ").toLowerCase().includes(normalized)
                    )
                    : products.slice(0, 4);

                container.innerHTML = matches.map((product) => `
                    <button type="button" onclick="app.navigate('pdp', { productId: '${product.id}' })" class="grid gap-4 border border-transparent bg-white p-4 text-left shadow-soft lux-ease hover:border-gold-deep md:grid-cols-[96px_minmax(0,1fr)]">
                        <img src="${product.image}" alt="${product.name}" class="h-28 w-full object-cover md:w-24">
                        <div>
                            <p class="text-[10px] font-semibold uppercase tracking-[0.24em] text-neutral-500">${product.brand} / ${product.surface}</p>
                            <h3 class="mt-2 text-3xl font-semibold leading-none text-black">${product.name}</h3>
                            <p class="mt-2 text-sm leading-7 text-neutral-700">${this.l(product.subtitle)}</p>
                            <p class="mt-3 text-sm font-semibold uppercase tracking-[0.18em] text-black">${this.formatMoney(product.price)}</p>
                        </div>
                    </button>
                `).join("");
                lucide.createIcons();
            },

            handleSearch(query) {
                this.renderSearchResults(query);
            },

            changeGalleryImage(image) {
                this.state.activeGalleryImage = image;
                this.renderPDP();
                lucide.createIcons();
            },

            selectSize(size) {
                this.state.selectedSize = size;
                this.renderPDP();
                lucide.createIcons();
            },

            changePdpQuantity(delta) {
                let qty = (this.state.pdpQuantity || 1) + delta;
                if (qty < 1) qty = 1;
                this.state.pdpQuantity = qty;
                this.renderPDP();
                lucide.createIcons();
            },

            runPdpAction(action) {
                if (this.state.pdpActionState.phase !== "idle") return;
                this.state.pdpActionState = { action, phase: "loading" };
                this.renderPDP();
                lucide.createIcons();

                setTimeout(() => {
                    this.state.pdpActionState = { action, phase: "success" };
                    this.renderPDP();
                    lucide.createIcons();

                    setTimeout(() => {
                        const productId = this.state.currentProductId;
                        const size = this.state.selectedSize;
                        const qty = this.state.pdpQuantity || 1;
                        this.state.pdpActionState = { action: null, phase: "idle" };

                        if (action === "add") {
                            this.addToCart(productId, size, true, qty);
                            if (this.state.currentView === "pdp") {
                                this.renderPDP();
                                lucide.createIcons();
                            }
                            return;
                        }

                        this.addToCart(productId, size, false, qty);
                        this.navigate("checkout");
                    }, 600);
                }, 400);
            },

            toggleWishlist(productId) {
                const idx = this.state.wishlist.indexOf(productId);
                if (idx > -1) {
                    this.state.wishlist.splice(idx, 1);
                    this.showToast(this.t("removedFromWishlist"));
                } else {
                    this.state.wishlist.push(productId);
                    this.showToast(this.t("addedToWishlist"));
                }
                this.renderWishlist();
                this.renderPDP();
                this.updateBadges();
                lucide.createIcons();
            },

            addToCart(productId, size, openCart, qty = 1) {
                const amount = typeof qty === 'number' && qty > 0 ? qty : 1;
                const existing = this.state.cart.find((item) => item.productId === productId && item.size === size);
                if (existing) {
                    existing.quantity += amount;
                } else {
                    this.state.cart.push({ productId, size, quantity: amount });
                }
                this.renderCart();
                this.showToast(this.t("addedToCart"));
                if (openCart) this.toggleCart(true);
            },

            addWishlistToCart(productId) {
                const product = products.find((item) => item.id === productId);
                if (!product) return;
                this.addToCart(productId, product.sizes[0], false);
                this.renderWishlist();
            },

            addSizePickerSelection(size) {
                if (!this.state.sizePickerProductId) return;
                this.addToCart(this.state.sizePickerProductId, size, false);
                this.closeSizePicker();
            },

            quickAdd(productId, event) {
                event?.stopPropagation();
                const product = this.getProduct(productId);
                if (window.innerWidth < 1024) {
                    this.openSizePicker(productId);
                    return;
                }
                this.addToCart(productId, product.sizes[0], true);
            },

            orderNow(productId) {
                const product = this.getProduct(productId);
                this.addToCart(productId, product.sizes[0], false);
                this.navigate("checkout");
            },

            addCurrentToCart(keepBrowsing) {
                this.runPdpAction(keepBrowsing ? "add" : "order");
            },

            removeFromCart(index) {
                this.state.cart.splice(index, 1);
                this.renderCart();
                this.renderCheckout();
                this.showToast(this.t("removedFromCart"));
            },

            changeQty(index, delta) {
                const item = this.state.cart[index];
                if (!item) return;
                item.quantity += delta;
                if (item.quantity <= 0) {
                    this.state.cart.splice(index, 1);
                }
                this.renderCart();
                this.renderCheckout();
            },

            updateBadges() {
                const count = this.getCartCount();
                const wishlistCount = this.state.wishlist.length;
                document.getElementById("cart-badge-desktop").textContent = count;
                document.getElementById("cart-badge-mobile").textContent = count;
                const desktopWishlistBadge = document.getElementById("wishlist-badge-desktop");
                const mobileWishlistBadge = document.getElementById("wishlist-badge-mobile");
                [desktopWishlistBadge, mobileWishlistBadge].forEach((badge) => {
                    if (!badge) return;
                    badge.textContent = wishlistCount;
                    badge.classList.toggle("hidden", wishlistCount === 0);
                    badge.classList.toggle("flex", wishlistCount > 0);
                });
            },

            startCheckout() {
                if (!this.state.cart.length) {
                    this.showToast(this.t("addBeforeCheckout"));
                    return;
                }
                this.toggleCart(false);
                this.navigate("checkout");
            },

            updateCheckoutField(field, value) {
                this.state.checkout[field] = value;
                this.renderCheckout();
                setTimeout(() => this.validateCheckout(), 0);
            },

            validateCheckout() {
                const name = document.getElementById("checkout-name");
                const phone = document.getElementById("checkout-phone");
                const address = document.getElementById("checkout-address");
                const note = document.getElementById("checkout-note");
                if (!name || !phone || !address) return;

                this.state.checkout.name = name.value.trim();
                this.state.checkout.phone = phone.value.trim();
                this.state.checkout.address = address.value.trim();
                this.state.checkout.note = note ? note.value.trim() : "";
            },

            backFromCheckout() {
                this.navigate("plp");
                this.toggleCart(true);
            },

            processPayment() {
                const nameInput = document.getElementById("checkout-name");
                const phoneInput = document.getElementById("checkout-phone");
                const cityInput = document.getElementById("checkout-city");
                const addressInput = document.getElementById("checkout-address");

                const name = nameInput ? nameInput.value.trim() : (this.state.checkout.name || "");
                const phone = phoneInput ? phoneInput.value.trim() : (this.state.checkout.phone || "");
                const city = cityInput ? cityInput.value.trim() : (this.state.checkout.city || "Maputo");
                const address = addressInput ? addressInput.value.trim() : (this.state.checkout.address || "");

                if (!name || !phone || !address) {
                    if (nameInput && !name) nameInput.classList.add("border-red-500");
                    if (phoneInput && !phone) phoneInput.classList.add("border-red-500");
                    if (addressInput && !address) addressInput.classList.add("border-red-500");
                    this.showToast("Por favor preencha o seu Nome, Telefone e Endereço.");
                    return;
                }

                const subtotal = this.getCartSubtotal();
                const shipping = this.getShippingFee();
                const total = subtotal + shipping;
                const orderNumber = `#GK${Math.floor(1000 + Math.random() * 9000)}`;

                const order = {
                    orderNumber: orderNumber,
                    name: name,
                    phone: phone,
                    city: city,
                    address: address,
                    payment: this.state.checkout.payment || "M-Pesa",
                    items: this.state.cart.map((item) => ({ ...item })),
                    total: total
                };

                this.state.lastOrder = order;

                // Clear cart
                this.state.cart = [];
                this.renderCart();
                this.navigate("confirmation");

                // Send to WhatsApp with popup & direct location fallback
                this.sendOrderToWhatsApp(order);
            },

            showAccountToast() {
                this.showToast(this.t("accountToast"));
            },

            showWishlistToast() {
                this.toggleWishlistDrawer(true);
            }
        };

        window.app = app;
        app.init();
    </script>
</body>
</html>
